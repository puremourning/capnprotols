name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta, "1.81.0"]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-capnproto
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --all-targets
      - name: Test
        run: cargo test

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all -- --check --unstable-features --error-on-unformatted

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-capnproto
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -Dwarnings

  # grammar/ is vendored from the vendor/tree-sitter-capnp submodule by
  # scripts/vendor-grammar.sh: the generated parser.c, the highlights query, and
  # the grammar's LICENSE. Regenerate parser.c from the pinned tree-sitter CLI,
  # re-run the vendor script, and fail if anything under grammar/ has drifted — so
  # grammar or query edits can never land without the vendored copies being updated.
  grammar:
    name: grammar in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pinned tree-sitter CLI
        working-directory: vendor/tree-sitter-capnp
        run: npm ci
      - name: Regenerate parser from grammar.js
        working-directory: vendor/tree-sitter-capnp
        # Only `tree-sitter generate` touches parser.c; `npm run build` additionally
        # runs node-gyp, which needs a native toolchain and is irrelevant here.
        # highlights.scm and LICENSE are static — the vendor script re-copies them.
        run: ./node_modules/.bin/tree-sitter generate
      - name: Re-vendor into grammar/ (parser.c, highlights.scm, LICENSE)
        run: ./scripts/vendor-grammar.sh
      - name: Fail if the vendored grammar has drifted
        run: |
          if ! git diff --exit-code -- grammar/; then
            echo "::error::grammar/ is out of sync with vendor/tree-sitter-capnp." \
                 "Run scripts/vendor-grammar.sh and commit the result."
            exit 1
          fi
