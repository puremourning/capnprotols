name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta, "1.81.0"]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-capnproto
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --all-targets
      - name: Test
        run: cargo test

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all -- --check --unstable-features --error-on-unformatted

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-capnproto
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -Dwarnings

  # grammar/ is a copy of the pinned vendor/tree-sitter-capnp submodule's committed
  # sources (parser.c, highlights.scm, LICENSE), produced by scripts/vendor-grammar.sh.
  # Re-run the copy and fail if anything under grammar/ drifts, so bumping the
  # submodule can never land without the vendored copies being refreshed.
  #
  # Note: we do NOT regenerate parser.c from grammar.js here. `tree-sitter generate`
  # is not byte-reproducible across platforms (state numbering differs), and keeping
  # parser.c in sync with grammar.js is the grammar repo's own CI responsibility. We
  # only assert that our vendored copy matches the submodule commit we pin.
  grammar:
    name: grammar in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Re-vendor into grammar/ (parser.c, highlights.scm, LICENSE)
        run: ./scripts/vendor-grammar.sh
      - name: Fail if the vendored grammar has drifted
        run: |
          if ! git diff --exit-code -- grammar/; then
            echo "::error::grammar/ is out of sync with the vendor/tree-sitter-capnp" \
                 "submodule. Run scripts/vendor-grammar.sh and commit the result."
            exit 1
          fi
