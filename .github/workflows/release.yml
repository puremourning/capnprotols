name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release: an explicit SemVer (e.g. 0.2.0, no v prefix) or a bump level (patch, minor, major).'
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Passed through to cargo-release verbatim, so it may be a version or a bump
      # level. cargo-release rejects anything it can't parse, and `allow-branch` in
      # [package.metadata.release] keeps releases to `main` — no need to re-check
      # either here.
      RELEASE_LEVEL: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-capnproto

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-release
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-release

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # cargo-release's own verification step is a build of the packaged crate, not a
      # test run, so a release would otherwise publish code whose tests never ran in
      # this workflow. The dispatch is manual and `main` may not be green yet.
      - name: Test
        run: cargo test

      # cargo-release does the whole dance: bump [package].version, update
      # Cargo.lock, rewrite the README install snippet (pre-release-replacements),
      # run a verifying `cargo publish`, commit "Release vX.Y.Z", tag vX.Y.Z, push
      # the commit and tag, and publish to crates.io. Config lives in
      # [package.metadata.release] in Cargo.toml.
      - name: Release
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo release "$RELEASE_LEVEL" --execute --no-confirm

      # Read the version back out of the bumped manifest rather than reusing the
      # input, which may have been a bump level rather than a number.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "capnprotols") | .version')
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes
