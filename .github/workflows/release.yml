name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.2.0 (no v prefix)'
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate version input
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid version: $VERSION (expected SemVer like 0.2.0, no v prefix)"
            exit 1
          fi

      - name: Verify on main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases must be triggered from main (got ${{ github.ref }})"
          exit 1

      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-capnproto

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-release
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-release

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # cargo-release does the whole dance: bump [package].version, update
      # Cargo.lock, rewrite the README install snippet (pre-release-replacements),
      # run a verifying `cargo publish`, commit "Release vX.Y.Z", tag vX.Y.Z, push
      # the commit and tag, and publish to crates.io. Config lives in
      # [package.metadata.release] in Cargo.toml.
      - name: Release
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo release "$VERSION" --execute --no-confirm

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes
