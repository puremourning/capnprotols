[package]
name = "capnprotols"
version = "0.2.0"
edition = "2021"
rust-version = "1.81.0"
description = "Language server and formatter (capnpfmt) for Cap'n Proto schema files"
license = "MIT"
readme = "README.md"
repository = "https://github.com/puremourning/capnprotols"
documentation = "https://docs.rs/capnprotols"
keywords = ["capnp", "capnproto", "lsp", "language-server", "formatter"]
categories = ["development-tools", "command-line-utilities"]
exclude = [
  "extension/**",
  ".github/**",
  ".claude/**",
  # The grammar source of truth lives in this submodule; the generated parser is
  # vendored into grammar/ (see scripts/vendor-grammar.sh) and published from there.
  "vendor/**",
]

default-run = "capnprotols"

# `cargo release` drives version bumps, tagging, and publishing (see
# .github/workflows/release.yml). Tags stay `vX.Y.Z` and the README install
# snippet is bumped automatically to match the released version.
[package.metadata.release]
allow-branch = ["main"]
tag-name = "v{{version}}"
pre-release-commit-message = "Release v{{version}}"
# The GitHub release is created by the workflow after the tag is pushed.
publish = true
push = true

[[package.metadata.release.pre-release-replacements]]
file = "README.md"
search = 'cargo install capnprotols --locked --version [0-9]+\.[0-9]+\.[0-9]+'
replace = "cargo install capnprotols --locked --version {{version}}"
exactly = 1

[lib]
name = "capnprotols"
path = "src/lib.rs"

[[bin]]
name = "capnprotols"
path = "src/main.rs"

[[bin]]
name = "capnpfmt"
path = "src/capnpfmt.rs"

[dependencies]
tower-lsp = "0.20"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "process", "sync", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ropey = "1.6"
dashmap = "5"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
capnp = "0.27.0-alpha"
tree-sitter = "0.20"
similar = "2"
ignore = "0.4"

[build-dependencies]
cc = "1"

# TEMPORARY: newtypes (`type X = …`) are not upstream yet, so the schema.capnp
# bindings we re-export from `capnp` (see src/schema_capnp.rs) need the fork that
# carries the `Node.type` union variant. Drop this section once a `capnp` release
# on crates.io includes newtype support — nothing else has to change.
[patch.crates-io]
capnp = { git = "https://github.com/puremourning/capnproto-rust", branch = "newtype", package = "capnp" }
