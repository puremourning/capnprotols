[package]
name = "capnprotols"
version = "0.1.1"
edition = "2021"
rust-version = "1.81.0"
description = "Language server and formatter (capnpfmt) for Cap'n Proto schema files"
license = "MIT"
readme = "README.md"
repository = "https://github.com/puremourning/capnprotols"
documentation = "https://docs.rs/capnprotols"
keywords = ["capnp", "capnproto", "lsp", "language-server", "formatter"]
categories = ["development-tools", "command-line-utilities"]
exclude = [
  "extension/**",
  ".github/**",
  ".claude/**",
]

default-run = "capnprotols"

[lib]
name = "capnprotols"
path = "src/lib.rs"

[[bin]]
name = "capnprotols"
path = "src/main.rs"

[[bin]]
name = "capnpfmt"
path = "src/capnpfmt.rs"

[dependencies]
tower-lsp = "0.20"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "process", "sync", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ropey = "1.6"
dashmap = "5"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
capnp = "0.25"
tree-sitter = "0.20"
tree-sitter-capnp = "1.5"
similar = "2"

[build-dependencies]
capnpc = "0.25"
